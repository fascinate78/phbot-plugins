name: Discord Changelog Notify

on:
  push:
    branches: [main]
    paths:
      - "plugins/**/changelog.md"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Test icin tek plugin adi (ör. FControl). Bos birakirsan tum pluginlerin guncel changelog'u yollanir."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed changelog files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLUGIN="${{ inputs.plugin }}"
            if [ -n "$PLUGIN" ]; then
              echo "plugins/$PLUGIN/changelog.md" > changed_files.txt
            else
              find plugins -mindepth 2 -maxdepth 2 -name changelog.md > changed_files.txt
            fi
          else
            BEFORE="${{ github.event.before }}"
            EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$EMPTY_TREE"
            fi
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'plugins/**/changelog.md' > changed_files.txt
          fi
          cat changed_files.txt

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord_changelog.py < changed_files.txt
